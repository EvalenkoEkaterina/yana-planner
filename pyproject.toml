[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yana-planner"
version = "0.1.0"
description = "Reproducible scenario planning for NKT transport on the Yana River"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "scipy==1.18.1"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
dev = ["ruff==0.17.4"]

[project.scripts]
yana = "yana_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
