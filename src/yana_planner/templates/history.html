{% extends 'base.html' %}{% block content %}<h1>История расчётов</h1><section><table><tr><th>Дата (UTC)</th><th>Сценарий</th><th>Срок, ч</th><th>Статус</th></tr>{% for run in runs %}<tr><td>{{ run.created_at }}</td><td><a href="{{ url_for('result_page', ident=run.id) }}">{{ run.scenario_name }}</a></td><td>{{ run.deadline_h }}</td><td>{{ run.status }}</td></tr>{% else %}<tr><td colspan="4">Сохранённых расчётов пока нет</td></tr>{% endfor %}</table></section>{% endblock %}
