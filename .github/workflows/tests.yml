name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_planning_form_state.mjs tests/test_route_package.mjs tests/test_multi_stop_ui.mjs tests/test_multi_stop_priority_comparison.mjs
      - run: node --check src/yana_planner/static/dispatcher.js
      - run: node --check src/yana_planner/static/multi-stop-ui.js
